name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing tag to deploy (rollback). Empty = build HEAD."
        required: false

concurrency: deploy-portfolio

env:
  IMAGE: ghcr.io/dilaxn/portfolio

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    if: ${{ !inputs.image_tag }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

  deploy:
    runs-on: ubuntu-24.04-arm
    needs: [build]
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_DEPLOY_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_DEPLOY_KEY_SECRET }}
      AWS_DEFAULT_REGION: ap-south-1
      SG_ID: sg-09c36ce8067f2b51d
    steps:
      - name: Resolve tag
        run: echo "TAG=${{ inputs.image_tag || github.sha }}" >> "$GITHUB_ENV"

      - name: Open SSH for runner
        run: |
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          echo "Runner IP: $RUNNER_IP"
          aws sts get-caller-identity
          aws ec2 authorize-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32
          sleep 10

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 5m
          timeout: 60s
          script: |
            set -e
            cd /opt/paas

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull portfolio
            docker compose up -d portfolio
            docker image prune -f
            echo "Deployed portfolio: ${{ env.TAG }}"

      - name: Record deployment
        if: always()
        run: |
          curl -sf -X POST https://ops.dilax.space/api/hooks/deployment \
            -H "Content-Type: application/json" \
            -H "x-webhook-secret: ${{ secrets.WEBHOOK_SECRET }}" \
            -d '{"app":"portfolio","sha":"${{ github.sha }}","status":"success","actor":"${{ github.actor }}","runUrl":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' || true

      - name: Close SSH for runner
        if: always()
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id $SG_ID --protocol tcp --port 22 --cidr $RUNNER_IP/32 || true
